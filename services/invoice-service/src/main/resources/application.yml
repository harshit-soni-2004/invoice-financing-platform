spring:
  application:
    name: invoice-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:invoice_db}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:invoice_svc}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    # The outbox relay marks an event published only after the broker confirms it.
    publisher-confirm-type: correlated
    listener:
      simple:
        # Failed messages go to the queue's dead-letter queue instead of looping.
        default-requeue-rejected: false
        # No in-listener retry: the consumer queue has delayed retry tiers (10 s, 1 min, 10 min) before its DLQ,
        # so a failing message never blocks a consumer thread while it waits.
        retry:
          enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer is the browser-visible URL of auth-service; keys are fetched from the internal JWK endpoint.
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
          audiences: ${AUTH_AUDIENCE:ifp-api}
          jws-algorithms: RS256
          authorities-claim-name: roles
          authority-prefix: ROLE_

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

invoice:
  business-zone: Asia/Kolkata
  max-amount: 100000000.00
  max-tenor-days: 180
  min-days-to-maturity-at-submission: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      # RabbitMQ is deliberately not part of readiness: the outbox absorbs broker outages, so a broker failure must
      # not take the HTTP API out of rotation.
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      # JSON (Elastic Common Schema) with service.name and MDC (correlationId) on every line; the `local` profile
      # switches back to human-readable output.
      console: ecs
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ifp: ${LOG_LEVEL_APP:INFO}

---
# Local development profile: human-readable console logs instead of the default JSON.
spring:
  config:
    activate:
      on-profile: local
logging:
  structured:
    format:
      console: ""
  pattern:
    correlation: "[%X{correlationId:-}] "

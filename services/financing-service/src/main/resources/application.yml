spring:
  application:
    name: financing-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:financing_db}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:financing_svc}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer is the browser-visible URL of auth-service; keys are fetched from the internal JWK endpoint.
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
          audiences: ${AUTH_AUDIENCE:ifp-api}
          jws-algorithms: RS256
          authorities-claim-name: roles
          authority-prefix: ROLE_

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

# Financing rules. Offer terms (rate, processing fee, installments) are always chosen explicitly by the financier;
# these values only bound what an offer may contain.
financing:
  business-zone: Asia/Kolkata
  max-advance-ratio: 0.98
  max-annual-rate: 0.3600
  max-offer-validity: 14d
  min-days-to-maturity: 7
  max-installments: 12
  offer-expiry-sweep-interval: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# JSON logs are enabled per environment with LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (set in Docker Compose).
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ifp: ${LOG_LEVEL_APP:INFO}

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:auth_db}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:auth_svc}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    # The outbox relay marks an event published only after the broker confirms it.
    publisher-confirm-type: correlated

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail fast so an unreachable Redis lets the login through (fail open) instead of hanging it.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

auth:
  # Browser-visible URL of this server. Every resource server expects exactly this value in `iss`.
  issuer: ${AUTH_ISSUER_URI:http://localhost:9000}
  audience: ${AUTH_AUDIENCE:ifp-api}
  access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
  spa:
    client-id: ifp-spa
    redirect-uris: ${AUTH_SPA_REDIRECT_URIS:http://localhost:4200/auth/callback}
    post-logout-redirect-uris: ${AUTH_SPA_POST_LOGOUT_REDIRECT_URIS:http://localhost:4200/}
    allowed-origins: ${AUTH_SPA_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # PKCS#8 PEM, e.g. file:./infra/keys/jwt-signing-key.pem (git-ignored; see scripts/generate-dev-jwt-key.sh).
    private-key-location: ${AUTH_JWT_PRIVATE_KEY_LOCATION:}
    key-id: ${AUTH_JWT_KEY_ID:}
    allow-ephemeral-key: false
  # Optional first administrator, created at startup only if none exists. Leave unset unless provisioning.
  bootstrap-admin:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
  # Throttling of POST /login and POST /oauth2/token, kept in Redis. Fails open if Redis is unavailable.
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    # Requests per client address and endpoint within one window.
    ip-requests: ${AUTH_RATE_LIMIT_IP_REQUESTS:30}
    ip-window: ${AUTH_RATE_LIMIT_IP_WINDOW:1m}
    # Failed logins per client address + username within the failure window before a lockout.
    max-failures: ${AUTH_RATE_LIMIT_MAX_FAILURES:5}
    failure-window: ${AUTH_RATE_LIMIT_FAILURE_WINDOW:15m}
    lockout: ${AUTH_RATE_LIMIT_LOCKOUT:5m}

server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      # RabbitMQ is deliberately not part of readiness: the outbox absorbs broker outages, so a broker failure must
      # not take the HTTP API out of rotation.
      group:
        readiness:
          include: readinessState,db
  # The login limiter fails open, so a Redis outage must not mark auth-service unhealthy.
  health:
    redis:
      enabled: false

logging:
  structured:
    format:
      # JSON (Elastic Common Schema) with service.name and MDC (correlationId) on every line; the `local` profile
      # switches back to human-readable output.
      console: ecs
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ifp: ${LOG_LEVEL_APP:INFO}

---
# Local development profile: human-readable console logs instead of the default JSON.
spring:
  config:
    activate:
      on-profile: local
logging:
  structured:
    format:
      console: ""
  pattern:
    correlation: "[%X{correlationId:-}] "

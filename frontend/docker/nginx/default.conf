server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration and the app shell must never be cached, or a redeploy keeps serving stale settings.
    location = /config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed bundles emitted by the Angular build (main-XXXXXXXX.js, styles-XXXXXXXX.css, chunk-XXXXXXXX.js).
    location ~* "^/[a-z0-9-]+-[A-Z0-9]{8}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}

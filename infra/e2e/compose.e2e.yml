# Disposable infrastructure for scripts/e2e-full.ps1. Started under a unique project name with random passwords,
# ephemeral 127.0.0.1 host ports and data in tmpfs, then removed with `docker compose down`. It shares nothing with
# the development stack in ../../docker-compose.yml (no container names, no named volumes).

services:
  mysql:
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      INVOICE_DB_PASSWORD: ${INVOICE_DB_PASSWORD:?}
      FINANCING_DB_PASSWORD: ${FINANCING_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      AUDIT_DB_MIGRATOR_PASSWORD: ${AUDIT_DB_MIGRATOR_PASSWORD:?}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?}
    ports:
      - "127.0.0.1::3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -e 'USE audit_db; SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - "127.0.0.1::5672"
      - "127.0.0.1::15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1::6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1::1025"
      - "127.0.0.1::8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

# Local development infrastructure, plus the full application stack behind the "app" profile.
# Usage: copy .env.example to .env, then
#   `docker compose up -d`                             infrastructure only (run the services from the IDE), or
#   `docker compose --profile app up -d --build --wait` everything, including the six services and the frontend.

name: invoice-financing

x-app-service: &app-service
  profiles: [app]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]

# Containers reach each other by service name; only the issuer stays browser-visible, because it must equal the
# `iss` claim that auth-service puts into tokens. Keys are fetched over the internal network instead.
x-resource-server-env: &resource-server-env
  DB_HOST: mysql
  DB_PORT: "3306"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
  AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
  AUTH_JWK_SET_URI: http://auth-service:9000/oauth2/jwks
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ifp-api}

services:
  mysql:
    image: mysql:8.4
    container_name: ifp-mysql
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      INVOICE_DB_PASSWORD: ${INVOICE_DB_PASSWORD:?set INVOICE_DB_PASSWORD in .env}
      FINANCING_DB_PASSWORD: ${FINANCING_DB_PASSWORD:?set FINANCING_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      AUDIT_DB_MIGRATOR_PASSWORD: ${AUDIT_DB_MIGRATOR_PASSWORD:?set AUDIT_DB_MIGRATOR_PASSWORD in .env}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?set AUDIT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP is only enabled after the init scripts finish, and audit_db is the last database created,
      # so this check passes only when MySQL is fully initialised.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -e 'USE audit_db; SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    container_name: ifp-rabbitmq
    hostname: ifp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ifp-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ifp-mailhog
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Application stack (profile "app") ----

  # DEVELOPMENT ONLY: creates the auth-service signing key once in the jwt-keys volume; later runs keep it.
  jwt-keygen:
    image: eclipse-temurin:21-jdk-alpine
    profiles: [app]
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        java /opt/ifp/GenerateDevJwtKey.java /keys/jwt-signing-key.pem
        && chown 10001:10001 /keys/jwt-signing-key.pem
        && chmod 0400 /keys/jwt-signing-key.pem
    volumes:
      - ./scripts/GenerateDevJwtKey.java:/opt/ifp/GenerateDevJwtKey.java:ro
      - jwt-keys:/keys
    restart: "no"

  auth-service:
    <<: *app-service
    image: ${IFP_IMAGE_REGISTRY:-ifp}/auth-service:${IFP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ifp-api}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_JWT_PRIVATE_KEY_LOCATION: file:/run/keys/jwt-signing-key.pem
      AUTH_SPA_REDIRECT_URIS: ${AUTH_SPA_REDIRECT_URIS:-http://localhost:4200/auth/callback}
      AUTH_SPA_ALLOWED_ORIGINS: ${AUTH_SPA_ALLOWED_ORIGINS:-http://localhost:4200}
      AUTH_SPA_POST_LOGOUT_REDIRECT_URIS: ${AUTH_SPA_POST_LOGOUT_REDIRECT_URIS:-http://localhost:4200/}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-}
      AUTH_RATE_LIMIT_IP_REQUESTS: ${AUTH_RATE_LIMIT_IP_REQUESTS:-30}
      AUTH_RATE_LIMIT_IP_WINDOW: ${AUTH_RATE_LIMIT_IP_WINDOW:-1m}
      AUTH_RATE_LIMIT_MAX_FAILURES: ${AUTH_RATE_LIMIT_MAX_FAILURES:-5}
      AUTH_RATE_LIMIT_FAILURE_WINDOW: ${AUTH_RATE_LIMIT_FAILURE_WINDOW:-15m}
      AUTH_RATE_LIMIT_LOCKOUT: ${AUTH_RATE_LIMIT_LOCKOUT:-5m}
    volumes:
      - jwt-keys:/run/keys:ro
    ports:
      - "127.0.0.1:${AUTH_PORT:-9000}:9000"
    depends_on:
      jwt-keygen:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  invoice-service:
    <<: *app-service
    image: ${IFP_IMAGE_REGISTRY:-ifp}/invoice-service:${IFP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/invoice-service/Dockerfile
    environment:
      <<: *resource-server-env
      DB_PASSWORD: ${INVOICE_DB_PASSWORD:?set INVOICE_DB_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  financing-service:
    <<: *app-service
    image: ${IFP_IMAGE_REGISTRY:-ifp}/financing-service:${IFP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/financing-service/Dockerfile
    environment:
      <<: *resource-server-env
      DB_PASSWORD: ${FINANCING_DB_PASSWORD:?set FINANCING_DB_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  notification-service:
    <<: *app-service
    image: ${IFP_IMAGE_REGISTRY:-ifp}/notification-service:${IFP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: *resource-server-env
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-no-reply@ifp.local}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  audit-service:
    <<: *app-service
    image: ${IFP_IMAGE_REGISTRY:-ifp}/audit-service:${IFP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    environment:
      <<: *resource-server-env
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:?set AUDIT_DB_PASSWORD in .env}
      DB_MIGRATOR_PASSWORD: ${AUDIT_DB_MIGRATOR_PASSWORD:?set AUDIT_DB_MIGRATOR_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  gateway:
    <<: *app-service
    image: ${IFP_IMAGE_REGISTRY:-ifp}/gateway:${IFP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      AUTH_JWK_SET_URI: http://auth-service:9000/oauth2/jwks
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ifp-api}
      AUTH_SERVICE_URI: http://auth-service:9000
      INVOICE_SERVICE_URI: http://invoice-service:8081
      FINANCING_SERVICE_URI: http://financing-service:8082
      NOTIFICATION_SERVICE_URI: http://notification-service:8083
      AUDIT_SERVICE_URI: http://audit-service:8084
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      GATEWAY_TRUSTED_PROXY_HOPS: ${GATEWAY_TRUSTED_PROXY_HOPS:-0}
      RATE_LIMIT_PUBLIC_REPLENISH_RATE: ${RATE_LIMIT_PUBLIC_REPLENISH_RATE:-1}
      RATE_LIMIT_PUBLIC_BURST_CAPACITY: ${RATE_LIMIT_PUBLIC_BURST_CAPACITY:-60}
      RATE_LIMIT_PUBLIC_REQUESTED_TOKENS: ${RATE_LIMIT_PUBLIC_REQUESTED_TOKENS:-12}
      RATE_LIMIT_API_REPLENISH_RATE: ${RATE_LIMIT_API_REPLENISH_RATE:-20}
      RATE_LIMIT_API_BURST_CAPACITY: ${RATE_LIMIT_API_BURST_CAPACITY:-40}
      RATE_LIMIT_API_REQUESTED_TOKENS: ${RATE_LIMIT_API_REQUESTED_TOKENS:-1}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
      financing-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy

  frontend:
    <<: *app-service
    image: ${IFP_IMAGE_REGISTRY:-ifp}/frontend:${IFP_IMAGE_TAG:-local}
    build:
      context: frontend
    environment:
      IFP_API_BASE_URL: ${IFP_PUBLIC_API_URL:-http://localhost:8080}
      IFP_AUTH_ISSUER: ${AUTH_ISSUER_URI:-http://localhost:9000}
      IFP_CLIENT_ID: ifp-spa
    # nginx writes its pid, temp files and the rendered config.json at start-up.
    read_only: false
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  mysql-data:
  rabbitmq-data:
  redis-data:
  jwt-keys:
